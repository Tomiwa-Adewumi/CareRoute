server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

careroute.ingestion.city=${CAREROUTE_INGESTION_CITY:Toronto}
careroute.ingestion.interval-ms=${CAREROUTE_INGESTION_INTERVAL_MS:600000}
careroute.ingestion.initial-delay-ms=${CAREROUTE_INGESTION_INITIAL_DELAY_MS:5000}
careroute.ingestion.ercompass-url=${CAREROUTE_ERCOMPASS_URL:https://ercompass.ca/api/current?province=ON&sort=wait}
