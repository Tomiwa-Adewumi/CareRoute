server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:careroute;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}

careroute.ingestion.city=${CAREROUTE_INGESTION_CITY:Toronto}
careroute.ingestion.interval-ms=${CAREROUTE_INGESTION_INTERVAL_MS:600000}
careroute.ingestion.initial-delay-ms=${CAREROUTE_INGESTION_INITIAL_DELAY_MS:5000}
careroute.ingestion.ercompass-url=${CAREROUTE_ERCOMPASS_URL:https://ercompass.ca/api/current?province=ON&sort=wait}
careroute.allowed-origins=${CAREROUTE_ALLOWED_ORIGINS:http://localhost:3000}
